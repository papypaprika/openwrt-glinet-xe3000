name: Build OpenWrt XE3000-v1

on:
  push:
    branches: [ openwrt-25.12-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget \
            xxd swig quilt

      - name: Run prepare.sh
        run: |
          cd x3000
          bash prepare.sh public

      - name: Validate requested package selections
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            stubby
            kmod-fs-ntfs3
            kmod-nls-base
            kmod-hwmon-core
            openssh-client
            msmtp
            msmtp-mta
            mosquitto-client-nossl
          )

          if [[ ! -f .config ]]; then
            echo "ERROR: .config not found after prepare.sh" >&2
            exit 1
          fi

          failed=0
          for package in "${packages[@]}"; do
            expected="CONFIG_PACKAGE_${package}=y"
            if grep -Fqx -- "$expected" .config; then
              echo "OK: $expected"
            else
              echo "ERROR: expected '$expected'" >&2
              current=$(grep -E "^(CONFIG_PACKAGE_${package}=|# CONFIG_PACKAGE_${package} is not set)" .config || true)
              if [[ -n "$current" ]]; then
                echo "  found: $current" >&2
              else
                echo "  symbol not present in .config" >&2
              fi
              failed=1
            fi
          done

          if (( failed )); then
            echo "One or more requested packages are not selected." >&2
            exit 1
          fi

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Collect firmware artifacts
        run: |
          mkdir -p output
          find bin/targets/mediatek/filogic/ \
            \( -name "*xe3000*sysupgrade*" -o \
               -name "*xe3000*factory*"    -o \
               -name "*xe3000*manifest" \) \
            -exec cp {} output/ \;
          ls -lh output/

      - name: Print package manifest
        run: |
          echo "=== MANIFEST ==="
          cat output/*manifest

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xe3000-${{ github.sha }}
          path: output/
          retention-days: 14
