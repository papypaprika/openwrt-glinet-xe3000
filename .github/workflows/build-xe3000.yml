name: Build OpenWrt XE3000

on:
 push:
   branches: [ openwrt-25.12 ]
 workflow_dispatch:

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
 build:
   runs-on: ubuntu-22.04
   timeout-minutes: 360

   steps:
     - name: Checkout repo
       uses: actions/checkout@v4

     - name: Free up disk space
       run: |
         sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                     /opt/ghc /usr/local/share/boost \
                     /usr/local/share/powershell \
                     /usr/share/swift
         df -h

     - name: Install build dependencies
       run: |
         sudo apt-get update
         sudo apt-get install -y \
           build-essential clang flex bison g++ gawk \
           gcc-multilib g++-multilib gettext git \
           libncurses-dev libncurses5-dev libssl-dev \
           libelf-dev python3-distutils python3-setuptools \
           python3-dev rsync unzip zlib1g-dev file wget \
           xxd swig quilt

     - name: Run prepare.sh
       run: |
         cd x3000
         bash prepare.sh public 2>&1 | tee /tmp/prepare.log
         exit ${PIPESTATUS[0]}

     - name: Inspect raw config files in repo vs composed .config
       run: |
         echo "=========================================="
         echo "  RAW x3000/config.common (critical pkgs only)"
         echo "=========================================="
         grep -nE "^(# )?CONFIG_PACKAGE_(modemmanager|curl|htop|qfirehose|quectel-5g-tools|luci-base|dbus|glib2|libmbim|stubby|tmux|rsync|dosfstools|vim-full|procps-ng|iperf3|luaposix|bind-dig|pciutils|usbutils|luci-proto-modemmanager)( |=)" x3000/config.common || echo "  NO MATCHES"
         echo ""
         echo "=========================================="
         echo "  RAW x3000/config.public (critical pkgs only)"
         echo "=========================================="
         grep -nE "^(# )?CONFIG_PACKAGE_(modemmanager|curl|htop|qfirehose|quectel-5g-tools|luci-base|dbus|glib2|libmbim|stubby|tmux|rsync|dosfstools|vim-full|procps-ng|iperf3|luaposix|bind-dig|pciutils|usbutils|luci-proto-modemmanager)( |=)" x3000/config.public || echo "  (no matches in config.public)"
         echo ""
         echo "=========================================="
         echo "  COMPOSED .config (same critical pkgs)"
         echo "=========================================="
         grep -nE "^(# )?CONFIG_PACKAGE_(modemmanager|curl|htop|qfirehose|quectel-5g-tools|luci-base|dbus|glib2|libmbim|stubby|tmux|rsync|dosfstools|vim-full|procps-ng|iperf3|luaposix|bind-dig|pciutils|usbutils|luci-proto-modemmanager)( |=)" .config || echo "  NONE FOUND IN .config"
         echo ""
         echo "=========================================="
         echo "  prepare.log: defconfig invocation"
         echo "=========================================="
         grep -nE "make defconfig|==> make|==> feeds (update|install)|Wiping tmp" /tmp/prepare.log || echo "  no matches"
         echo ""
         echo "=========================================="
         echo "  prepare.log: full tail (last 60 lines)"
         echo "=========================================="
         tail -60 /tmp/prepare.log

     - name: Snapshot .config state immediately after prepare.sh
       run: |
         echo "=========================================="
         echo "  .config state immediately after prepare.sh"
         echo "=========================================="
         echo "Total lines:           $(wc -l < .config)"
         echo "CONFIG_PACKAGE_*=y:    $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
         echo "is not set lines:      $(grep -c '^# CONFIG_PACKAGE_.* is not set' .config)"
         cp .config /tmp/post-prepare.config

     - name: Force visible defconfig and dump Makefile DEPENDS
       # DECISIVE diagnostic. Two parts:
       # (1) Re-run defconfig and capture every warning/error verbatim.
       # (2) Dump the literal DEPENDS line from curl's and modemmanager's
       #     Makefiles. Whatever symbol they require that isn't satisfied
       #     in our .config is the single root cause that has been
       #     dropping all these packages.
       run: |
         echo "=========================================="
         echo "  defconfig with verbose output"
         echo "=========================================="
         make defconfig V=s 2>&1 | tee /tmp/defconfig.log
         echo ""
         echo "=========================================="
         echo "  KCONFIG warnings / errors only"
         echo "=========================================="
         grep -nE "warning:|error:|recursive|undefined|requires.*not selected|depends on.*which is not" /tmp/defconfig.log | head -100 || echo "  none"
         echo ""
         echo "=========================================="
         echo "  curl Makefile DEPENDS/CATEGORY"
         echo "=========================================="
         find package/feeds/packages/curl -name "Makefile" -exec grep -nE "DEPENDS|SECTION|CATEGORY|@" {} \; || echo "  no Makefile found"
         echo ""
         echo "=========================================="
         echo "  modemmanager Makefile DEPENDS/CATEGORY"
         echo "=========================================="
         find package/feeds/packages/modemmanager -name "Makefile" -exec grep -nE "DEPENDS|SECTION|CATEGORY|@" {} \; || echo "  no Makefile found"
         echo ""
         echo "=========================================="
         echo "  htop Makefile DEPENDS/CATEGORY"
         echo "=========================================="
         find package/feeds/packages/htop -name "Makefile" -exec grep -nE "DEPENDS|SECTION|CATEGORY|@" {} \; || echo "  no Makefile found"
         echo ""
         echo "=========================================="
         echo "  qfirehose Makefile DEPENDS/CATEGORY"
         echo "=========================================="
         find package/feeds/custom/qfirehose -name "Makefile" -exec grep -nE "DEPENDS|SECTION|CATEGORY|@" {} \; || echo "  no Makefile found"
         echo ""
         echo "=========================================="
         echo "  Final CRITICAL PACKAGE CHECK in .config"
         echo "=========================================="
         for pkg in modemmanager luci-base curl htop tmux dosfstools \
                    qfirehose quectel-5g-tools dbus glib2 libmbim \
                    procps-ng stubby luaposix iperf3 vim-full rsync; do
           line=$(grep -E "^(CONFIG_PACKAGE_${pkg}=|# CONFIG_PACKAGE_${pkg} )" .config || echo "NOT IN .config AT ALL")
           printf "  %-30s %s\n" "$pkg:" "$line"
         done
         echo ""
         echo "=========================================="
         echo "  feeds.conf actually used"
         echo "=========================================="
         cat feeds.conf

     - name: Download package sources
       run: |
         make download -j8 V=s 2>&1 | tee /tmp/download.log || true
         make download -j1 V=s 2>&1 | tee -a /tmp/download.log
         find dl/ -size -1024c -delete 2>/dev/null || true

     - name: Build firmware
       run: |
         make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
         BUILD_EXIT=${PIPESTATUS[0]}
         if [ $BUILD_EXIT -ne 0 ]; then
           echo "Parallel build failed, retrying single-threaded..."
           make -j1 V=s 2>&1 | tail -150 | tee /tmp/build-retry.log
           exit 1
         fi

     - name: Collect firmware artifacts AND buildinfo
       if: success()
       run: |
         mkdir -p output
         find bin/targets/mediatek/filogic/ \
           \( -name "*xe3000*sysupgrade*" -o \
              -name "*xe3000*factory*"    -o \
              -name "*xe3000*manifest" \) \
           -exec cp {} output/ \;
         find bin/targets/mediatek/filogic/ \
           \( -name "*.buildinfo" -o -name "sha256sums" \) \
           -exec cp {} output/ \;
         cp .config output/used.config
         cp /tmp/post-prepare.config output/ 2>/dev/null || true
         cp /tmp/prepare.log output/ 2>/dev/null || true
         cp /tmp/defconfig.log output/ 2>/dev/null || true
         ls -lh output/

     - name: Print package manifest
       if: success()
       run: |
         echo "=== MANIFEST ==="
         cat output/*manifest 2>/dev/null

     - name: Upload firmware
       if: success()
       uses: actions/upload-artifact@v4
       with:
         name: openwrt-xe3000-${{ github.sha }}
         path: output/
         retention-days: 14

     - name: Upload all logs on failure
       if: failure()
       uses: actions/upload-artifact@v4
       with:
         name: build-logs-${{ github.sha }}
         path: |
           /tmp/prepare.log
           /tmp/post-prepare.config
           /tmp/defconfig.log
           /tmp/download.log
           /tmp/build.log
           /tmp/build-retry.log
         retention-days: 7
