name: Build OpenWrt XE3000

on:
  push:
    branches: [ openwrt-25.12 ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/share/swift
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libncurses5-dev libssl-dev \
            libelf-dev python3-distutils python3-setuptools \
            python3-dev rsync unzip zlib1g-dev file wget \
            xxd swig quilt

      - name: Run prepare.sh
        run: |
          cd x3000
          bash prepare.sh public 2>&1 | tee /tmp/prepare.log
          exit ${PIPESTATUS[0]}

      - name: Check what defconfig actually depends on
        run: |
          echo "=== Existence of tmp/info/.packageinfo ==="
          ls -la tmp/info/ 2>/dev/null || echo "  tmp/info/ does not exist"
          echo ""
          echo "=== Does .packageinfo know about curl? ==="
          grep -c "^Package: curl\$" tmp/info/.packageinfo 2>/dev/null || echo "  not present or file missing"
          echo ""
          echo "=== Does .packageinfo know about modemmanager? ==="
          grep -c "^Package: modemmanager\$" tmp/info/.packageinfo 2>/dev/null || echo "  not present or file missing"
          echo ""
          echo "=== Force rebuild of packageinfo and check again ==="
          rm -rf tmp/
          make prepare-tmpinfo
          ls -la tmp/info/ 2>/dev/null
          grep -c "^Package: curl\$" tmp/info/.packageinfo || echo "  STILL not present"
          grep -c "^Package: modemmanager\$" tmp/info/.packageinfo || echo "  STILL not present"
          echo ""
          echo "=== Verify symlinks BEFORE re-defconfig ==="
          for path in \
            "package/feeds/packages/curl/Makefile" \
            "package/feeds/packages/modemmanager/Makefile" \
            "package/feeds/packages/htop/Makefile" \
            "package/feeds/custom/qfirehose/Makefile"; do
            if [ -f "$path" ]; then
              echo "  PRESENT  $path"
            else
              echo "  MISSING  $path"
            fi
          done
          echo ""
          echo "=== Now re-run defconfig and check key packages ==="
          # Re-inject the =y lines that may have been dropped, then defconfig.
          cat x3000/config.common > .config.fresh
          echo "" >> .config.fresh
          echo "# --- variant: public ---" >> .config.fresh
          cat x3000/config.public >> .config.fresh
          mv .config.fresh .config
          make defconfig 2>&1 | tail -10
          echo ""
          echo "=== Result for critical packages ==="
          for pkg in modemmanager curl htop qfirehose dosfstools luci-base; do
            grep -E "^(CONFIG_PACKAGE_${pkg}=|# CONFIG_PACKAGE_${pkg} )" .config || echo "  $pkg: not in .config"
          done

      - name: Snapshot .config state immediately after prepare.sh
        run: |
          echo "=========================================="
          echo "  .config state after diagnostic re-defconfig"
          echo "=========================================="
          echo "Total lines:           $(wc -l < .config)"
          echo "CONFIG_PACKAGE_*=y:    $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
          echo "is not set lines:      $(grep -c '^# CONFIG_PACKAGE_.* is not set' .config)"
          cp .config /tmp/post-prepare.config

      - name: Force visible defconfig
        run: |
          make defconfig V=s 2>&1 | tee /tmp/defconfig.log
          echo ""
          echo "=== Final CRITICAL PACKAGE CHECK in .config ==="
          for pkg in modemmanager luci-base curl htop tmux dosfstools \
                     qfirehose quectel-5g-tools dbus glib2 libmbim \
                     procps-ng stubby luaposix iperf3 vim-full rsync; do
            line=$(grep -E "^(CONFIG_PACKAGE_${pkg}=|# CONFIG_PACKAGE_${pkg} )" .config || echo "NOT IN .config AT ALL")
            printf "  %-30s %s\n" "$pkg:" "$line"
          done

      - name: Download package sources
        run: |
          make download -j8 V=s 2>&1 | tee /tmp/download.log || true
          make download -j1 V=s 2>&1 | tee -a /tmp/download.log
          find dl/ -size -1024c -delete 2>/dev/null || true

      - name: Build firmware
        run: |
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Parallel build failed, retrying single-threaded..."
            make -j1 V=s 2>&1 | tail -150 | tee /tmp/build-retry.log
            exit 1
          fi

      - name: Collect firmware artifacts AND buildinfo
        if: success()
        run: |
          mkdir -p output
          find bin/targets/mediatek/filogic/ \
            \( -name "*xe3000*sysupgrade*" -o \
               -name "*xe3000*factory*"    -o \
               -name "*xe3000*manifest" \) \
            -exec cp {} output/ \;
          find bin/targets/mediatek/filogic/ \
            \( -name "*.buildinfo" -o -name "sha256sums" \) \
            -exec cp {} output/ \;
          cp .config output/used.config
          cp /tmp/post-prepare.config output/ 2>/dev/null || true
          cp /tmp/prepare.log output/ 2>/dev/null || true
          cp /tmp/defconfig.log output/ 2>/dev/null || true
          ls -lh output/

      - name: Print package manifest
        if: success()
        run: |
          echo "=== MANIFEST ==="
          cat output/*manifest 2>/dev/null

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xe3000-${{ github.sha }}
          path: output/
          retention-days: 14

      - name: Upload all logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/prepare.log
            /tmp/post-prepare.config
            /tmp/defconfig.log
            /tmp/download.log
            /tmp/build.log
            /tmp/build-retry.log
          retention-days: 7
