name: Build OpenWrt XE3000

on:
  push:
    branches: [ openwrt-25.12-xe3000 ]
  workflow_dispatch:   # allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost
          df -h

      - name: Run prepare.sh
        run: |
          cd x3000
          bash prepare.sh
          # prepare.sh clones OpenWrt, applies patches, sets up feeds

      - name: Copy diffconfig and expand it
        run: |
          cp x3000/diffconfig openwrt/.config
          cd openwrt
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | tee /tmp/download.log
          # Retry any failed downloads
          make download -j1 V=s 2>&1 | tail -20

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          # If parallel build fails, retry single-threaded for cleaner errors:
          # make -j1 V=s 2>&1 | tail -50

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p output
          cp openwrt/bin/targets/mediatek/filogic/*xe3000*sysupgrade* output/ || true
          cp openwrt/bin/targets/mediatek/filogic/*xe3000*factory* output/ || true
          ls -lh output/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xe3000-${{ github.sha }}
          path: output/
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
