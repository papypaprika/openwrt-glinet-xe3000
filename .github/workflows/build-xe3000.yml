name: Build OpenWrt XE3000

on:
  push:
    branches: [ openwrt-25.12 ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/share/swift
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libncurses5-dev libssl-dev \
            libelf-dev python3-distutils python3-setuptools \
            python3-dev rsync unzip zlib1g-dev file wget \
            xxd swig quilt

      - name: Run prepare.sh
        # prepare.sh handles the full sequence internally:
        #   custom feed clone → feeds.conf install → .config compose
        #   → files/ overlay → feeds update/install → make defconfig
        #   → patches
        # No separate feeds or defconfig steps needed in this workflow.
        run: |
          cd x3000
          bash prepare.sh public 2>&1 | tee /tmp/prepare.log
          exit ${PIPESTATUS[0]}

      - name: Verify key packages survived defconfig
        # Catches any regression where a package is silently dropped.
        # Fails fast with a clear per-package report before wasting
        # 2+ hours on a build that would produce a broken image.
        run: |
          echo "=== Checking critical packages in .config ==="
          MISSING=0
          for pkg in \
            modemmanager luci-base luci-proto-modemmanager \
            luci-app-firewall luci-mod-network luci-ssl \
            libmbim mbim-utils stubby \
            dosfstools exfat-fsck exfat-mkfs \
            iperf3 tmux procps-ng luaposix \
            qfirehose quectel-5g-tools; do
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "  OK:      $pkg"
            else
              echo "  MISSING: $pkg"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING package(s) were dropped by defconfig."
            echo "Check that the relevant feed is in x3000/feeds.conf and"
            echo "that prepare.sh runs defconfig after feeds install."
            exit 1
          fi

      - name: Download package sources
        run: |
          make download -j8 V=s 2>&1 | tee /tmp/download.log || true
          make download -j1 V=s 2>&1 | tee -a /tmp/download.log
          find dl/ -size -1024c -delete 2>/dev/null || true

      - name: Build firmware
        run: |
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Parallel build failed, retrying single-threaded..."
            make -j1 V=s 2>&1 | tail -150 | tee /tmp/build-retry.log
            exit 1
          fi

      - name: Collect firmware artifacts
        if: success()
        run: |
          mkdir -p output
          find bin/targets/mediatek/filogic/ \
            \( \
              -name "*xe3000*sysupgrade*" -o \
              -name "*xe3000*factory*"    -o \
              -name "*xe3000*manifest"    -o \
              -name "*xe3000*buildinfo"   -o \
              -name "*xe3000*sha256sums"  \
            \) \
            -exec cp {} output/ \;
          ls -lh output/

      - name: Print package manifest
        if: success()
        run: |
          echo "=============================="
          echo "     PACKAGE MANIFEST"
          echo "=============================="
          cat output/*manifest 2>/dev/null || echo "No manifest found"
          echo ""
          echo "=============================="
          echo "     FEEDS BUILD INFO"
          echo "=============================="
          cat output/*feeds.buildinfo 2>/dev/null || echo "No feeds.buildinfo found"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xe3000-${{ github.sha }}
          path: output/
          retention-days: 14

      - name: Upload all logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/prepare.log
            /tmp/download.log
            /tmp/build.log
            /tmp/build-retry.log
          retention-days: 7
